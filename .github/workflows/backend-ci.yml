name: Backend CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Automated tests
        run: npm test -- --runInBand --coverage

      - name: Redis integration tests
        env:
          REDIS_INTEGRATION: true
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test -- --runInBand test/redis-session-store.integration.spec.ts

      - name: Build
        run: npm run build
