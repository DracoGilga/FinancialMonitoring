name: "Security Analysis (OWASP ZAP DAST)"

on:
  push:
    branches: ["master", "main"]

jobs:
  dast-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Crear el archivo .env a partir del de ejemplo para que Docker no falle
      - name: Setup environment variables
        run: cp .env.example .env

      # 2. Levantar el backend y todas sus dependencias mágicamente
      - name: Start Docker Services
        # Al levantar 'backend', Docker levantará db, redis, localstack, etc. por los depends_on
        run: docker compose up -d backend

      # 3. Esperar a que el healthcheck del backend reporte "healthy"
      - name: Wait for backend to be ready
        run: |
          echo "Esperando a que el backend compile y levante..."
          while [ "$(docker inspect -f '{{.State.Health.Status}}' backend)" != "healthy" ]; do
            sleep 5
            echo "Aún iniciando..."
          done
          echo "¡Backend listo y saludable!"

      # 4. Ataque de OWASP ZAP
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.8.0
        with:
          # IMPORTANTE: Tu docker-compose expone el backend en el puerto 3001 hacia tu PC
          target: "http://localhost:3001/api-json"
          format: openapi
          fail_action: false

      # 5. Guardar reporte
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-report
          path: report_html.html
