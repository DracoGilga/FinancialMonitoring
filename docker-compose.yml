version: "3.8"

services:
  frontend:
    container_name: app_frontend
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    container_name: app_backend
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    environment:
      - NODE_ENV=development
